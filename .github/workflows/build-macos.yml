name: Build macOS
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'
jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install automake libtool pkg-config boost libevent zeromq qt@5 create-dmg
          brew install berkeley-db@5 || brew install berkeley-db

      - name: Build miniupnpc 2.2.2
        run: |
          cd /tmp
          curl -L -o miniupnpc-2.2.2.tar.gz https://miniupnp.tuxfamily.org/files/miniupnpc-2.2.2.tar.gz
          tar -xzf miniupnpc-2.2.2.tar.gz
          cd miniupnpc-2.2.2
          make -j$(sysctl -n hw.ncpu) libminiupnpc.a
          sudo mkdir -p /usr/local/lib /usr/local/include/miniupnpc
          sudo install *.h /usr/local/include/miniupnpc/
          sudo install libminiupnpc.a /usr/local/lib/

      - name: Build libnatpmp
        run: |
          cd /tmp
          curl -L -o libnatpmp.tar.gz https://github.com/miniupnp/libnatpmp/archive/07004b97cf691774efebe70404cf22201e4d330d.tar.gz
          tar -xzf libnatpmp.tar.gz
          cd libnatpmp-07004b97cf691774efebe70404cf22201e4d330d
          make -j$(sysctl -n hw.ncpu) libnatpmp.a
          sudo mkdir -p /usr/local/lib /usr/local/include
          sudo install *.h /usr/local/include/
          sudo install libnatpmp.a /usr/local/lib/

      - name: Build Nito
        run: |
          ./autogen.sh
          export PATH="/opt/homebrew/opt/qt@5/bin:/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/qt@5/lib/pkgconfig:/opt/homebrew/opt/berkeley-db@5/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig"
          export LDFLAGS="-L/opt/homebrew/opt/qt@5/lib -L/opt/homebrew/opt/berkeley-db@5/lib -L/opt/homebrew/lib -L/usr/local/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/qt@5/include -I/opt/homebrew/opt/berkeley-db@5/include -I/opt/homebrew/include -I/usr/local/include"
          ./configure --disable-tests --disable-bench \
            --with-gui=qt5 \
            --with-incompatible-bdb \
            --with-miniupnpc \
            --with-natpmp
          make -j$(sysctl -n hw.ncpu)

      - name: Create tar.gz package
        run: |
          mkdir -p release/nito-3.0.1/bin
          cp src/nitod release/nito-3.0.1/bin/
          cp src/nito-cli release/nito-3.0.1/bin/
          cp src/qt/nito-qt release/nito-3.0.1/bin/
          cp src/nito-tx release/nito-3.0.1/bin/
          cp src/nito-wallet release/nito-3.0.1/bin/
          cp src/nito-util release/nito-3.0.1/bin/
          strip release/nito-3.0.1/bin/* || true
          cd release
          tar -czvf nito-3.0.1-arm64-apple-darwin.tar.gz nito-3.0.1/

      - name: Create DMG installer
        run: |
          mkdir -p dmg_contents
          mkdir -p "dmg_contents/Nito-Qt.app/Contents/MacOS"
          mkdir -p "dmg_contents/Nito-Qt.app/Contents/Resources"
          cp src/qt/nito-qt "dmg_contents/Nito-Qt.app/Contents/MacOS/"
          cp src/qt/res/icons/nito.icns "dmg_contents/Nito-Qt.app/Contents/Resources/nito.icns" || true
          cat > "dmg_contents/Nito-Qt.app/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>nito-qt</string>
              <key>CFBundleIconFile</key>
              <string>nito.icns</string>
              <key>CFBundleIdentifier</key>
              <string>org.nito.Nito-Qt</string>
              <key>CFBundleName</key>
              <string>Nito-Qt</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>3.0.1</string>
              <key>CFBundleVersion</key>
              <string>3.0.1</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          create-dmg \
            --volname "Nito Core" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Nito-Qt.app" 150 185 \
            --app-drop-link 450 185 \
            "release/nito-3.0.1-arm64-apple-darwin.dmg" \
            "dmg_contents/" || true

      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: nito-3.0.1-arm64-apple-darwin-tar
          path: release/nito-3.0.1-arm64-apple-darwin.tar.gz

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nito-3.0.1-arm64-apple-darwin-dmg
          path: release/nito-3.0.1-arm64-apple-darwin.dmg
